[project]
name = "pm-hook"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Abhishek", email = "officialabhishek0808@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard,standerd]>=0.162.1",
    "psycopg[binary]>=3.3.9",
    "pydantic-settings>=2.16.2",
    "sqlalchemy>=2.1.9",
]

[project.scripts]
pm-hook = "pm_hook:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "alembic>=1.20.1",
    "httpx>=0.28.1",
    "pytest>=9.2.0",
]
